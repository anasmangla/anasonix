name: Publish Anasonix Apps

on:
  push:
    branches: ["main"]
    paths:
      - "ask-islam/**"
      - "Qadian/**"
      - ".github/workflows/ask-islam-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site/Qadian
          cp -R ask-islam/. _site/
          cp Qadian/index.html Qadian/app.js Qadian/session.js Qadian/diary-data.js Qadian/styles.css Qadian/robots.txt Qadian/sitemap.xml _site/Qadian/
          cp -R Qadian/assets Qadian/sessions _site/Qadian/
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
