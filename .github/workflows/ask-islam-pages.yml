name: Publish Ask Islam Form

on:
  push:
    branches: ["main"]
    paths:
      - "ask-islam/**"
      - ".github/workflows/ask-islam-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ask-islam-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload form
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./ask-islam"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
